# secrets/.sops.yaml — SOPS age key authorisation (TEMPLATE).
#
# Bootstrap (run once, on the target machine, as root):
#
#   1. Generate an age key from the host's SSH ed25519 key:
#        ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#      (install `age` first: nix shell nixpkgs#age nixpkgs#ssh-to-age)
#
#   2. Replace the commented `age:` block below with the printed key, then
#      create+encrypt the store:
#        sops secrets/secrets.yaml
#      add the `users/sid/password` key with the output of:
#        mkpasswd -m yescrypt
#
# After that, `nixos-rebuild switch` will decrypt /run/secrets automatically
# using /etc/ssh/ssh_host_ed25519_key.
#
# Example:
#creation_rules:
#  - path_regex: secrets\.yaml$
#    age: >-
#      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
